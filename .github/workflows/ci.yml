name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: seatlock
          POSTGRES_DB: seatlock_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -h localhost -U seatlock -d seatlock_test"
          --health-interval 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://seatlock:seatlock@localhost:5433/seatlock_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Integration tests (Postgres)
        run: npm run test:integration
